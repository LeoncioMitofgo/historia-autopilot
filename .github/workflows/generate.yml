name: Generar lote de guiones

on:
  schedule:
    - cron: "0 8 1 * *"   # el día 1 de cada mes, 08:00 UTC
  workflow_dispatch: {}    # permite lanzarlo manualmente desde la pestaña Actions

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # TODO (Copilot / usuario): añadir aquí la key del proveedor de LLM
      # elegido, ej. ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python scripts/generate_script.py
        working-directory: scripts
